#
# THE BIND ADDRESS IS NOT SET, so the service listens on every interface. That
# is deliberate and it is the one setting here worth knowing about: a Canton or
# a scribe running in a virtual machine has to be able to reach the JWKS, and a
# loopback bind makes that fail in a way that looks like a key problem. This
# service publishes its own private keys on request; it belongs on a
# development machine and nowhere else.
#
# Override anything below on the command line, e.g.
#   java -jar raposza-oidc-server-<version>-app.jar --server.address=127.0.0.1

server:
  port: 32002
  # THE ADMIN UI'S SESSION COOKIE, JSESSIONID - 0.5.0. SameSite=Strict keeps a
  # page on another site from riding an administrator's session; the UI is one
  # origin and loses nothing. NOT `secure`, because the service is reached over
  # plain http on a workstation and a browser drops a Secure cookie there.
  # Behind an https proxy add --server.servlet.session.cookie.secure=true.
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

spring:
  application:
    name: raposza-oidc
  main:
    banner-mode: "off"
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # so "aud": "x" and "aud": ["x"] are both accepted
      accept-single-value-as-array: true
      fail-on-unknown-properties: false

logging:
  level:
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # the mint is one flat surface; grouping it by tag helps nobody
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

raposza:
  # `raposza.jwtmint` UNTIL 0.4.x; the old names are refused from 0.5.0 -
  # RetiredSettings.
  oidc:
    # blank takes ~/.raposza/jwtmint/keys
    dir-keys: ""
    # REQUIRED SINCE 0.4.0 - blank refuses to start. It is the address every
    # consumer reaches this service on, and that one string is the discovery
    # document's `issuer`, the base of every endpoint URL it advertises, and
    # the `iss` of every token minted; RFC 8414 section 3.3 compares them
    # literally. Until 0.4.0 a blank value was guessed from this machine's
    # addresses, and the guess could not be right for a verifier behind a port
    # forward, a proxy or a container network. For example
    # http://127.0.0.1:32002 on one machine, https://id.example.com behind a
    # proxy.
    issuer: ""
    # TWENTY-FOUR HOURS. There is no fixed ceiling in Canton: the limit is
    # whatever `max-token-lifetime` is set to, and with the key absent the
    # default refuses anything much over five minutes. AuthOverlay renders
    # the ceiling from the plan's own lifetime, so the participant is
    # configured to accept exactly what this mints.
    ttl-seconds: 86400
    default-alg: RS256
    default-subject: raposza
    # WHO CAN SIGN IN at /oauth2/authorize: comma-separated name:password.
    # Blank means nobody. Plain text on purpose - a test system's users. The
    # name is the `sub` of every token issued to that person.
    users: ""
